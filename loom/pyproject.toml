[project]
name = "loom"
version = "0.1.0"
description = "Loom: multi-agent Experience Center engagements, intake to tracked adoption, with four human gates."
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.2.100",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
loom = "loom.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "engine"}
packages = ["loom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["engine", "."]
