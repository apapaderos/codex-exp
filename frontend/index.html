<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>NEXUS — Solve for X</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── AUTH OVERLAY ─────────────────────────────────────────────────────── -->
<div id="auth-overlay" class="overlay">
  <div class="overlay-card">
    <div class="nexus-logo">NEXUS</div>
    <p class="subtitle">Solve for X Experience Center</p>
    <button id="btn-login" class="btn-primary">Sign in with Azure AD</button>
  </div>
</div>

<!-- ── SESSION SETUP OVERLAY ────────────────────────────────────────────── -->
<div id="setup-overlay" class="overlay hidden">
  <div class="overlay-card">
    <div class="nexus-logo">NEXUS</div>
    <p class="subtitle">New Session</p>
    <input id="input-client" type="text" placeholder="Client name" class="text-input" />
    <input id="input-x" type="text" placeholder="Problem statement (the X)" class="text-input" />
    <button id="btn-create-session" class="btn-primary">Start Session</button>
  </div>
</div>

<!-- ── MAIN SHELL ────────────────────────────────────────────────────────── -->
<div id="app" class="hidden">

  <!-- Header -->
  <header class="shell-header">
    <div class="header-left">
      <span class="nexus-wordmark">NEXUS</span>
      <span id="session-label" class="session-label"></span>
    </div>
    <div class="header-center">
      <div id="phase-indicator" class="phase-indicator">
        <span class="phase-pill active" data-phase="REFRAME">REFRAME</span>
        <span class="phase-sep">›</span>
        <span class="phase-pill" data-phase="EXPLORE">EXPLORE</span>
        <span class="phase-sep">›</span>
        <span class="phase-pill" data-phase="SHAPE">SHAPE</span>
      </div>
      <div id="activity-label" class="activity-label">Activity 1 of 4</div>
    </div>
    <div class="header-right">
      <div id="energy-badge" class="energy-badge medium">MEDIUM</div>
      <button id="btn-advance" class="btn-secondary">Next Activity ›</button>
      <button id="btn-end-session" class="btn-danger">End Session</button>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="shell-grid">

    <!-- LEFT: Transcript + Capture feed -->
    <section class="panel panel-left">
      <div class="panel-header">
        <span class="panel-title">LIVE TRANSCRIPT</span>
        <div id="mic-indicator" class="mic-dot off" title="Microphone status"></div>
      </div>
      <div id="transcript-feed" class="transcript-feed"></div>
      <div id="transcript-interim" class="transcript-interim"></div>
    </section>

    <!-- CENTER: NEXUS output + commands -->
    <section class="panel panel-center">
      <div class="panel-header">
        <span class="panel-title">NEXUS</span>
        <span id="latency-badge" class="latency-badge hidden"></span>
      </div>

      <!-- Command buttons -->
      <div class="command-grid">
        <button class="cmd-btn" data-cmd="what do we know">What do we know</button>
        <button class="cmd-btn" data-cmd="challenge this">Challenge this</button>
        <button class="cmd-btn" data-cmd="provoke">Provoke</button>
        <button class="cmd-btn" data-cmd="scenario">Scenario</button>
        <button class="cmd-btn" data-cmd="stress test">Stress test</button>
        <button class="cmd-btn" data-cmd="pattern">Pattern</button>
        <button class="cmd-btn" data-cmd="synthesize">Synthesize</button>
        <button class="cmd-btn capture-btn" data-cmd="capture">Flag moment</button>
      </div>

      <!-- NEXUS response output -->
      <div id="nexus-output" class="nexus-output">
        <div class="nexus-placeholder">Trigger a command to activate NEXUS.</div>
      </div>

      <!-- Override input (appears after NEXUS responds) -->
      <div id="override-row" class="override-row hidden">
        <input id="override-input" type="text" placeholder="Facilitator correction..." class="text-input-sm" />
        <button id="btn-override" class="btn-secondary-sm">Record</button>
      </div>
    </section>

    <!-- RIGHT: Session state — assumptions, tensions, commitments -->
    <section class="panel panel-right">
      <div class="tabs">
        <button class="tab active" data-tab="assumptions">Assumptions</button>
        <button class="tab" data-tab="tensions">Tensions</button>
        <button class="tab" data-tab="directions">Directions</button>
        <button class="tab" data-tab="commitments">Commitments</button>
        <button class="tab" data-tab="moments">Moments</button>
      </div>
      <div id="tab-assumptions" class="tab-content active">
        <div id="assumptions-list" class="state-list"></div>
        <button class="btn-add" data-target="assumptions">+ Add manually</button>
      </div>
      <div id="tab-tensions" class="tab-content">
        <div id="tensions-list" class="state-list"></div>
        <button class="btn-add" data-target="tensions">+ Add manually</button>
      </div>
      <div id="tab-directions" class="tab-content">
        <div id="directions-list" class="state-list"></div>
        <button class="btn-add" data-target="directions">+ Add manually</button>
      </div>
      <div id="tab-commitments" class="tab-content">
        <div id="commitments-list" class="state-list"></div>
        <button class="btn-add" data-target="commitments">+ Add manually</button>
      </div>
      <div id="tab-moments" class="tab-content">
        <div id="moments-list" class="state-list"></div>
      </div>
    </section>

  </main>

  <!-- Alert banner (key moment flagged) -->
  <div id="alert-banner" class="alert-banner hidden"></div>

  <!-- Advance activity modal -->
  <div id="advance-modal" class="modal hidden">
    <div class="modal-card">
      <h3>Advance to Next Activity</h3>
      <p class="modal-hint">Provide a brief summary of this activity before moving on.</p>
      <textarea id="advance-summary" class="textarea" rows="4" placeholder="What happened in this activity? Key insight or decision..."></textarea>
      <div class="modal-actions">
        <button id="btn-advance-cancel" class="btn-secondary">Cancel</button>
        <button id="btn-advance-confirm" class="btn-primary">Advance</button>
      </div>
    </div>
  </div>

  <!-- Add item modal -->
  <div id="add-modal" class="modal hidden">
    <div class="modal-card">
      <h3 id="add-modal-title">Add Item</h3>
      <input id="add-modal-text" type="text" class="text-input" placeholder="Description..." />
      <input id="add-modal-stakeholders" type="text" class="text-input hidden" placeholder="Stakeholders (comma-separated)" />
      <div class="modal-actions">
        <button id="btn-add-cancel" class="btn-secondary">Cancel</button>
        <button id="btn-add-confirm" class="btn-primary">Add</button>
      </div>
    </div>
  </div>

  <!-- Synthesis modal (post-session) -->
  <div id="synthesis-modal" class="modal hidden">
    <div class="modal-card modal-large">
      <h3>Session Synthesis</h3>
      <div id="synthesis-output" class="synthesis-output"></div>
      <div class="modal-actions">
        <button id="btn-synthesis-close" class="btn-secondary">Close</button>
        <button id="btn-synthesis-copy" class="btn-primary">Copy to clipboard</button>
      </div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
