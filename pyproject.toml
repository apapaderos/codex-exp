[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS — Intelligence engine for the Solve for X Experience Center"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Azure
    "azure-cognitiveservices-speech>=1.38.0",
    "openai>=1.35.0",                          # Azure OpenAI via openai SDK
    "azure-identity>=1.17.0",                  # Azure AD / managed identity

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "alembic>=1.13.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",                           # JWKS fetch

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
