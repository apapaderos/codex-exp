# ── NEXUS — local development stack ───────────────────────────────────────────
#
# Services:
#   db      — PostgreSQL 16 with pgvector extension
#   nexus   — NEXUS FastAPI application
#
# Usage:
#   1. Copy .env.example to .env and fill in your Azure keys
#   2. docker compose up --build
#   3. Open http://localhost:8000 on your tablet (same network)
#
# For production on Azure Container Apps:
#   - Use Azure Database for PostgreSQL Flexible Server (pgvector supported)
#   - Remove the `db` service; point DATABASE_URL at the managed instance
#   - Enable managed identity and remove API key env vars (use DefaultAzureCredential)

version: "3.9"

services:

  # ── PostgreSQL + pgvector ──────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev
      POSTGRES_DB: nexus
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── NEXUS application ──────────────────────────────────────────────────────
  nexus:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env           # all secrets live here — never commit .env
    environment:
      # Override the DATABASE_URL to use the compose service name
      DATABASE_URL: postgresql+asyncpg://nexus:nexus_dev@db:5432/nexus
      NEXUS_ENV: development
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload: mount source during development.
      # Remove this in production (bake code into image instead).
      - ./nexus:/app/nexus:ro
      - ./frontend:/app/frontend:ro
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn nexus.main:app
          --host 0.0.0.0
          --port 8000
          --reload
          --reload-dir nexus
      "

volumes:
  db_data:
