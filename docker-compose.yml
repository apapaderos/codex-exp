# ── NEXUS MVP — local development stack ───────────────────────────────────────
#
# Usage:
#   1. Copy .env.example to .env and fill in your 4 Azure values
#   2. docker compose up --build
#   3. Open http://localhost:8000 in your browser (or on your tablet via local IP)
#
# No database needed — transcript is held in memory for the duration of the session.

version: "3.9"

services:
  nexus:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload mounts — remove in production
      - ./server.py:/app/server.py:ro
      - ./static:/app/static:ro
    command: >
      uvicorn server:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app
